name: Crear release

on:
  push:
    tags:
      - "v*"          # Solo se dispara con tags que empiecen por "v"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Crear zip del proyecto
        run: |
          carpeta="Indexator-${{ github.ref_name }}"
          mkdir "$carpeta"

          # Copiamos todo menos lo excluido, dentro de la carpeta
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' \
                    --exclude='*.zip' --exclude='img' \
                    --exclude="$carpeta" \
                    ./ "$carpeta/"

          zip -r "$carpeta.zip" "$carpeta"

      - name: Crear release (borrador)
        uses: softprops/action-gh-release@v2
        with:
          name: "Indexator ${{ github.ref_name }}"
          body: |
            ## Nuevo en esta versión
          draft: true
          files: "Indexator-${{ github.ref_name }}.zip"